<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>CameraUp AR Floor & Cubes</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    #hint {
      position: absolute; top: 24px; left: 0; width: 100%; text-align: center;
      color: #fff; font-size: 14px; pointer-events: none; z-index: 10;
      text-shadow: 0 1px 4px rgba(0,0,0,0.9); padding: 0 20px;
    }
  </style>
</head>
<body>
  <div id="hint">Нажмите «Start AR» и двигайтесь, чтобы подойти к кубам</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';

    /* ---------- сцена ---------- */
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 50);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.xr.enabled = true;
    document.body.appendChild(renderer.domElement);

    /* ---------- свет ---------- */
    scene.add(new THREE.HemisphereLight(0xffffff, 0x222222, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 1.5);
    sun.position.set(3, 5, 2);
    scene.add(sun);

    /* ---------- пол ---------- */
    const grid = new THREE.GridHelper(4, 4, 0x00aaff, 0x555555);
    grid.material.transparent = true;
    grid.material.opacity = 0.35;
    scene.add(grid);

    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(4, 4),
      new THREE.MeshBasicMaterial({ color: 0x001133, transparent: true, opacity: 0.2, side: THREE.DoubleSide })
    );
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    /* ---------- кубы по углам ---------- */
    const s = 0.35;                 // размер куба
    const d = 1.3;                  // расстояние от центра до угла
    const geo = new THREE.BoxGeometry(s, s, s);
    const colors = [0xff3366, 0x33ff66, 0x3366ff, 0xffcc00];
    const positions = [
      [-d, s/2, -d],
      [ d, s/2, -d],
      [-d, s/2,  d],
      [ d, s/2,  d],
    ];

    positions.forEach((pos, i) => {
      const mat = new THREE.MeshStandardMaterial({ color: colors[i], roughness: 0.3, metalness: 0.1 });
      const cube = new THREE.Mesh(geo, mat);
      cube.position.set(...pos);
      scene.add(cube);
    });

    /* ---------- кнопка AR ---------- */
    // local-floor: origin на уровне пола, пользователь стартует в центре
    document.body.appendChild(ARButton.createButton(renderer, {
      requiredFeatures: ['local-floor']
    }));

    renderer.xr.addEventListener('sessionstart', () => {
      const refSpace = renderer.xr.getReferenceSpace();
      // Сдвигаем origin вверх на 1.6 м → камера стартует на высоте 1.6 м над полом
      const offset = new XRRigidTransform({ x: 0, y: 1.6, z: 0 });
      renderer.xr.setReferenceSpace(refSpace.getOffsetReferenceSpace(offset));
    });
    
    /* ---------- цикл ---------- */
    renderer.setAnimationLoop(() => renderer.render(scene, camera));

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
