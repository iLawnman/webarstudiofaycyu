<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>1 Modules AR Marker Viewer</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar.js"></script>
  <link rel="stylesheet" href="styles.css">
  <base target="_blank">
</head>
<body class="show-arjs-debug">

<div class="chrome" id="chrome">
  <div class="chrome-row">
    <div id="statusPill" class="status-pill"><span class="led"></span><span id="statusText">поиск…</span></div>
    <label class="chip on" id="debugChip"><input type="checkbox" id="debugToggle" checked> рамки</label>
    <span id="diagStatus"></span>
  </div>
</div>

<button id="uiToggle" type="button">UI</button>

<div class="arjs-loader" id="loader">
  <div class="spinner"></div>
  <p>Камера…</p>
</div>

<div id="markerFrame"><div class="box"></div></div>

<div id="logPanel" class="hidden">
  <button id="logEar" type="button" title="Лог"><span>ЛОГ</span></button>
  <div id="logPanelHead">
    <span>ЛОГ</span>
    <div style="display:flex;gap:6px;">
      <button id="logClearBtn" type="button">очистить</button>
      <button id="logHideBtn" type="button">✕</button>
    </div>
  </div>
  <div id="logList"></div>
</div>

<a-scene
        id="scene"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: mediump; antialias: true; alpha: true"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: true; detectionMode: mono_and_matrix; matrixCodeType: 3x3; markersAreaEnabled: true;"
        loading-screen="enabled: false"
>
  <a-assets></a-assets>

  <!-- Пол -->
  <a-plane id="groundPlane" position="0 -0.5 -2" rotation="-90 0 0" width="6" height="6"
           material="color:#1a2630; opacity:0.85; transparent: true; side: double">
  </a-plane>

  <!-- Статичная сфера в центре мира -->
  <a-sphere id="worldSphere" position="0 0 0" radius="2"
            material="color:#5ee3a5; emissive:#2f7a58; emissiveIntensity:0.35; metalness:0.2; roughness:0.3">
  </a-sphere>

  <!-- Маркер Hiro -->
  <a-marker id="markerHiro" preset="hiro" emitevents="true" smooth="true" smoothCount="5" smoothTolerance="0.01" smoothThreshold="2">
    <a-box position="0 0 1" depth="1" height="1" width="1"
           material="color:#5ee3a5; emissive:#2f7a58; emissiveIntensity:0.45; metalness:0.1; roughness:0.4">
    </a-box>
  </a-marker>

  <!-- Камера -->
  <a-entity camera></a-entity>
</a-scene>

<script type="module" src="app.js"></script>
</body>
</html>
