<template id="ar-target">
  <style>
    .panel {
      width: 380px;
      height: 480px;
      background: rgba(10, 10, 20, 0.95);
      border: 2px solid rgba(0, 255, 170, 0.6);
      border-radius: 16px;
      padding: 16px;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .panel-img {
      width: 100%;
      height: 140px;
      object-fit: contain;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
    }
    .panel-text {
      font-size: 16px;
      line-height: 1.4;
      color: #ffffff;
      margin-bottom: 12px;
      text-align: center;
      word-wrap: break-word;
    }
    .quest-options-grid {
      display: grid;
      gap: 8px;
      width: 100%;
    }
    .quest-btn {
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 14px;
      font-weight: 600;
      text-align: center;
    }
    .quest-input-block {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .quest-input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      font-size: 14px;
    }
    .quest-submit-btn {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: #00cc66;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      text-align: center;
    }
    .quest-slider {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      width: 100%;
    }
    .slide-content {
      flex: 1;
      text-align: center;
      font-size: 14px;
      color: #eeeeee;
    }
    .slide-nav {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 16px;
    }
  </style>

  <sphere
    name="sphere"
    data-radius="0.01"
    data-position="0.000,0.000,0.000"
    data-rotation="0,0,0"
  ></sphere>

  <!-- Центральная перенесенная панель оверлея внутри AR Target -->
  <panel
    name="questionPanel"
    data-width="0.24"
    data-height="0.30"
    data-position="0.000,0.000,0.020"
    data-rotation="-90,0,0"
  >
    <div class="panel">
      {{imageHtml}}
      <div class="panel-text">{{question}}</div>
      <div class="panel-body">{{bodyHtml}}</div>
    </div>
  </panel>
</template>
