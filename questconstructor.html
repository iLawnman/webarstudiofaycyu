<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>АР Приключения - Configurator</title>
  <style>
    :root {
      --bg-dark: #0b0f17;
      --card-bg: #151c2a;
      --card-border: #232d42;
      --input-bg: #0d121d;
      --text-main: #e2e8f0;
      --text-muted: #8a99ad;
      --accent-cyan: #00f2fe;
      --accent-green: #10b981;
      --accent-hover: #00d2ff;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 20px;
      font-size: 14px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn:hover {
      background: #334155;
    }

    .btn-primary {
      background: #059669;
      border-color: #10b981;
      color: white;
    }

    .btn-primary:hover {
      background: #10b981;
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--card-border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 20px;
      background: rgba(21, 28, 42, 0.5);
      transition: border-color 0.2s;
    }

    .drop-zone.dragover {
      border-color: var(--accent-cyan);
      background: rgba(0, 242, 254, 0.05);
    }

    /* Tabs */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .tabs-container {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    .tab-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 14px;
      min-width: 140px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-card:hover {
      border-color: #3b82f6;
    }

    .tab-card.active {
      background: #0d2838;
      border-color: var(--accent-cyan);
    }

    .tab-title {
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }

    .tab-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Main Grid */
    .main-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .panel-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-cyan);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Forms */
    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 4px;
      padding: 8px 10px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent-cyan);
    }

    textarea.form-control {
      resize: vertical;
      min-height: 70px;
    }

    /* Answer Cards */
    .answer-card {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 12px;
      position: relative;
    }

    .answer-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      color: #f59e0b;
      margin-bottom: 10px;
    }

    .btn-danger {
      background: transparent;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 14px;
    }

    /* Flow Section */
    .flow-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .flow-item {
      background: var(--input-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .flow-item-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .flow-item-title {
      font-weight: 700;
    }

    .flow-item-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .badge {
      background: #0284c7;
      color: white;
      font-weight: 700;
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 12px;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="title">
      <span>🚀</span> АР Приключения - Configurator
    </div>
    <div class="btn-group">
      <label class="btn">
        📁 Загрузить JSON
        <input type="file" id="jsonInput" accept=".json" multiple>
      </label>
      <button class="btn btn-primary" id="exportBtn">💾 Скачать JSON</button>
    </div>
  </div>

  <!-- Drag & Drop Zone -->
  <div class="drop-zone" id="dropZone">
    Перетащите сюда JSON файлы (Questtable.json и Answers.json) или кликните "Загрузить JSON"
  </div>

  <!-- Quest Tabs -->
  <div class="section-label">Квесты в выбранной папке:</div>
  <div class="tabs-container" id="tabsContainer"></div>

  <!-- Main Grid -->
  <div class="main-grid">
    <!-- Left Panel: Quest Properties -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">📍 Параметры Квеста (Questtable)</div>
        <button class="btn" style="padding: 4px 8px; font-size: 12px;" id="addQuestBtn">+ Новый квест</button>
      </div>
      <div id="questForm"></div>
    </div>

    <!-- Right Panel: Answers & Logic -->
    <div class="panel">
      <div class="panel-header">
        <div class="panel-title">🎯 Ответы и Ветвление (Answers)</div>
        <button class="btn" style="padding: 4px 8px; font-size: 12px;" id="addAnswerBtn">+ Ответ</button>
      </div>
      <div id="answersContainer"></div>
    </div>
  </div>

  <!-- Bottom Section: Flow Logic -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">🔄 Цепочка ходов и логика ответов</div>
    </div>
    <div class="flow-list" id="flowContainer"></div>
  </div>

  <script>
    // Embedded initial data from sources
    let questTableRaw = [
      ["id","QuestID","BasePrefab","GoalIndex","GoalImage","RecognitionImage","SignImage","Question","Task","AnswerList","Timer","RightWayIndx","RightWayQuest","RightReactionSign","RightReaction","WrongWayQuest","WrongReactionSign","WrongReaction","Artefact","NextWayQuest","DistanceTimer"],
      ["Start","Start","BasePrefabQuestions","","","ARAppIconJpg","ARAppIconJpg","Пиратский корабль непросто обнаружить издалека. \n\nВ подзорной трубе видны паруса, пустые бойницы и крохотные фигурки экипажа...","1","A00, A01, A02","1","1, 2","Q8","ARAppIcon","Тысяча чертей! Все работает!","Q8","ARAppIcon","Тысяча чертей! Все работает!","","","1"],
      ["Q8","Q8","BasePrefabQuestions","","","tgid0001-reco","tgid0011","Гром и молния! Раз вы здесь, значит, ответили на предыдущий вопрос.","1","A03, A04, A05","1","2","Q2a","tgid0003","Якорь мне в бухту!","Q3","tgid0004","By Thunder! Ветер не туда.","","","1"],
      ["Art1","Art1","BasePrefabQuestions","0","art1","tgid0002-reco","tgid0002","Арррр!\n\nВот это удача!","2","A06","","","Q3","tgid0004","Не зеваем на руле!","Q3","tgid0004","Не зеваем на руле!","","","1"],
      ["Q2a","Q2a","BasePrefabQuestions","","","tgid0003-reco","tgid0003","Ноты - это вам не карты...","1","A07, A08, A09","1","2","Art1","tgid0002","Йо-хо-хо!","Q4a","tgid0005","Pack of henhearted numbskulls!","","","1"],
      ["Q3","Q3","BasePrefabQuestions","","","tgid0004-reco","tgid0004","Абордаж удался...","1","A10, A11, A12","1","2","Art2","tgid0006","Поднимаем Веселого Роджера!","Q5a","tgid0007","Blast ye!","","","1"]
    ];

    let answersRaw = [
      ["id","AnswerID","AnswerType","Question","MainTxt_Text","VideoType_VideoType","VideoLink_VideoLink","MainText_Decor_2lines_Image","4corner_decor_Image","MainText_Decor_IfEmpty_Image","AdditionalImg_Image","TitleText_Text","TitleBackEmptyImg_Image","HelpUpText_Text","HelpDownText_Text","LeftPanel_If_Title_Empty_Image","AnswerPicture_Image","RightPanel_If_Title_Empty_Image","AdditionalPrefab_Prefab","Sound_Sound","Music_Music","StartAnimation_Animation","IdleAnimation_Animation","DeleteAnimation_Animation"],
      ["A00","A00","Slide","","MainTxt_Text 1 - демонстрация стрима видео.","","","1","1","","","СТАРТ","","","","","tgid0000_Question","","","","","","","ScaleOut:1"],
      ["A01","A01","","","1. Видео как часть игрового интерфейса","portrait","https://r4quest.ru/r4questdata/document_5260609517623739159.mp4","","","art3","","СТРИМ ВИДЕО","","","","","tgid0000_RA","","","salute_oneshot","","","",""],
      ["A02","A02","","","2. Видео без игрового интерфейса","portrait:solo","https://r4quest.ru/r4questdata/Video_ChromaKey.mp4","","","","","СТРИМ ВИДЕО БЕЗ ПРАФАБА","","","","","tgid0000_RA1","","","Art_Found_oneshot","","","",""],
      ["A03","A03","Slide","","Чем обозначают путь корабля?","","","","","","","","","Подсказка верхняя","Подсказка нижняя","1","tgid0011_Q","","AditionalBack-Pirates","","","","","ScaleOut:1"],
      ["A04","A04","","","Чем обозначают путь корабля?","","","","","","","","","Подсказка верхняя","Подсказка нижняя","1","tgid0011_WA","","","","","","",""],
      ["A05","A05","","","Чем обозначают путь корабля?","","","","","","","","","Подсказка верхняя","Подсказка нижняя","1","tgid0011_RA","","","","","","",""],
      ["A06","A06","Art","","Красный кристаллик модель","","","1","1","","art2","","art1","Подсказка верхняя","Подсказка нижняя","1","Panel_BG","","Artefact-Crystal","find_art_new1_oneshot","","","FXHolder:Artefact-Crystal_RotateY:4","ScaleOut:1"]
    ];

    // Helper functions to convert 2D array to Objects
    function arrayToObjects(arr) {
      if (!arr || arr.length < 2) return [];
      const headers = arr[0];
      return arr.slice(1).map(row => {
        let obj = {};
        headers.forEach((h, i) => {
          obj[h] = row[i] !== undefined ? row[i] : "";
        });
        return obj;
      });
    }

    function objectsToArray(objs, headers) {
      let result = [headers];
      objs.forEach(obj => {
        let row = headers.map(h => obj[h] !== undefined ? obj[h] : "");
        result.push(row);
      });
      return result;
    }

    let quests = arrayToObjects(questTableRaw);
    let answers = arrayToObjects(answersRaw);
    let activeQuestIndex = 0;

    // Render Quest Tabs
    function renderTabs() {
      const container = document.getElementById('tabsContainer');
      container.innerHTML = '';
      quests.forEach((q, idx) => {
        const card = document.createElement('div');
        card.className = `tab-card ${idx === activeQuestIndex ? 'active' : ''}`;
        card.onclick = () => { activeQuestIndex = idx; updateUI(); };
        card.innerHTML = `
          <div class="tab-title">Квест #${idx + 1}</div>
          <div class="tab-subtitle">${q.QuestID || 'Без ID'}</div>
        `;
        container.appendChild(card);
      });
    }

    // Render Left Panel (Quest Properties)
    function renderQuestForm() {
      const container = document.getElementById('questForm');
      if (quests.length === 0) {
        container.innerHTML = '<p style="color: var(--text-muted)">Нет доступных квестов</p>';
        return;
      }
      const q = quests[activeQuestIndex];

      container.innerHTML = `
        <div class="form-group">
          <label class="form-label">ID Квеста (QuestID)</label>
          <input type="text" class="form-control" value="${q.QuestID || ''}" oninput="updateQuestField('QuestID', this.value)">
        </div>
        <div class="form-group">
          <label class="form-label">Метка / Распознавание (RecognitionImage)</label>
          <input type="text" class="form-control" value="${q.RecognitionImage || ''}" oninput="updateQuestField('RecognitionImage', this.value)">
        </div>
        <div class="form-group">
          <label class="form-label">Текст вопроса (Question)</label>
          <textarea class="form-control" oninput="updateQuestField('Question', this.value)">${q.Question || ''}</textarea>
        </div>
        <div class="form-group">
          <label class="form-label">AR Префаб (BasePrefab)</label>
          <input type="text" class="form-control" value="${q.BasePrefab || ''}" oninput="updateQuestField('BasePrefab', this.value)">
        </div>
        <div class="form-group">
          <label class="form-label">Список ответов (AnswerList)</label>
          <input type="text" class="form-control" value="${q.AnswerList || ''}" oninput="updateQuestField('AnswerList', this.value)">
        </div>
        <div class="form-group">
          <label class="form-label">Следующий квест при успехе (RightWayQuest)</label>
          <input type="text" class="form-control" value="${q.RightWayQuest || ''}" oninput="updateQuestField('RightWayQuest', this.value)">
        </div>
      `;
    }

    function updateQuestField(field, value) {
      quests[activeQuestIndex][field] = value;
      if (field === 'QuestID') renderTabs();
      if (field === 'AnswerList') renderAnswersForm();
      renderFlow();
    }

    // Render Right Panel (Answers Form)
    function renderAnswersForm() {
      const container = document.getElementById('answersContainer');
      container.innerHTML = '';

      if (quests.length === 0) return;
      const currentQuest = quests[activeQuestIndex];
      const answerIds = (currentQuest.AnswerList || '').split(',').map(s => s.trim()).filter(Boolean);

      answerIds.forEach((ansId, idx) => {
        let ansObj = answers.find(a => a.AnswerID === ansId);
        if (!ansObj) {
          ansObj = { AnswerID: ansId, AnswerType: '', MainTxt_Text: '', StartAnimation: '', IdleAnimation: '', DeleteAnimation: '' };
          answers.push(ansObj);
        }

        const card = document.createElement('div');
        card.className = 'answer-card';
        card.innerHTML = `
          <div class="answer-card-header">
            <span>Вариант ответа #${idx + 1} (${ansId})</span>
            <button class="btn-danger" onclick="removeAnswerFromQuest('${ansId}')">✕</button>
          </div>
          <div class="form-group">
            <label class="form-label">Тип ответа (AnswerType)</label>
            <input type="text" class="form-control" value="${ansObj.AnswerType || ''}" oninput="updateAnswerField('${ansId}', 'AnswerType', this.value)">
          </div>
          <div class="form-group">
            <label class="form-label">Текст ответа (MainTxt_Text)</label>
            <textarea class="form-control" oninput="updateAnswerField('${ansId}', 'MainTxt_Text', this.value)">${ansObj.MainTxt_Text || ''}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">Анимации (Start / Idle / Delete)</label>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px;">
              <input type="text" class="form-control" placeholder="Start" value="${ansObj.StartAnimation || ''}" oninput="updateAnswerField('${ansId}', 'StartAnimation', this.value)">
              <input type="text" class="form-control" placeholder="Idle" value="${ansObj.IdleAnimation || ''}" oninput="updateAnswerField('${ansId}', 'IdleAnimation', this.value)">
              <input type="text" class="form-control" placeholder="Delete" value="${ansObj.DeleteAnimation || ''}" oninput="updateAnswerField('${ansId}', 'DeleteAnimation', this.value)">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function updateAnswerField(ansId, field, value) {
      let ansObj = answers.find(a => a.AnswerID === ansId);
      if (ansObj) {
        ansObj[field] = value;
      }
    }

    function removeAnswerFromQuest(ansId) {
      let currentQuest = quests[activeQuestIndex];
      let list = (currentQuest.AnswerList || '').split(',').map(s => s.trim()).filter(Boolean);
      list = list.filter(id => id !== ansId);
      currentQuest.AnswerList = list.join(', ');
      renderQuestForm();
      renderAnswersForm();
    }

    // Render Bottom Section (Flow Chain)
    function renderFlow() {
      const container = document.getElementById('flowContainer');
      container.innerHTML = '';

      quests.forEach((q, idx) => {
        const item = document.createElement('div');
        item.className = 'flow-item';
        item.innerHTML = `
          <div class="flow-item-info">
            <div class="flow-item-title">Квест #${idx + 1}: ${q.QuestID || 'Без ID'} (Префаб: ${q.BasePrefab || 'N/A'})</div>
            <div class="flow-item-sub">[Ответы: ${q.AnswerList || 'Нет'}] ➔ Далее: ${q.RightWayQuest || 'Конец'}</div>
          </div>
          <span class="badge">Активен</span>
        `;
        container.appendChild(item);
      });
    }

    // New Quest & Answer Adders
    document.getElementById('addQuestBtn').onclick = () => {
      const newId = `Q_${quests.length + 1}`;
      quests.push({
        id: newId,
        QuestID: newId,
        BasePrefab: "BasePrefabQuestions",
        Question: "Новый вопрос",
        AnswerList: ""
      });
      activeQuestIndex = quests.length - 1;
      updateUI();
    };

    document.getElementById('addAnswerBtn').onclick = () => {
      const currentQuest = quests[activeQuestIndex];
      const newAnsId = `A_${Date.now().toString().slice(-4)}`;
      let list = (currentQuest.AnswerList || '').split(',').map(s => s.trim()).filter(Boolean);
      list.push(newAnsId);
      currentQuest.AnswerList = list.join(', ');

      answers.push({
        id: newAnsId,
        AnswerID: newAnsId,
        AnswerType: "Slide",
        MainTxt_Text: "Новый вариант ответа"
      });

      renderQuestForm();
      renderAnswersForm();
    };

    // JSON Export
    document.getElementById('exportBtn').onclick = () => {
      const questHeaders = questTableRaw[0];
      const answerHeaders = answersRaw[0];

      const fullQuestData = objectsToArray(quests, questHeaders);
      const fullAnswerData = objectsToArray(answers, answerHeaders);

      const exportObj = {
        QuestTable: fullQuestData,
        Answers: fullAnswerData
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObj, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", "R4Quest_Config.json");
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    };

    // JSON Import Handler
    document.getElementById('jsonInput').addEventListener('change', handleFileSelect);

    function handleFileSelect(evt) {
      const files = evt.target.files;
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const reader = new FileReader();
        reader.onload = (e) => {
          try {
            const data = JSON.parse(e.target.result);
            if (data.QuestTable) quests = arrayToObjects(data.QuestTable);
            if (data.Answers) answers = arrayToObjects(data.Answers);
            if (Array.isArray(data) && file.name.toLowerCase().includes('quest')) {
              quests = arrayToObjects(data);
            } else if (Array.isArray(data) && file.name.toLowerCase().includes('answer')) {
              answers = arrayToObjects(data);
            }
            activeQuestIndex = 0;
            updateUI();
          } catch (err) {
            alert('Ошибка чтения JSON: ' + err.message);
          }
        };
        reader.readAsText(file);
      }
    }

    // Drag and drop handlers
    const dropZone = document.getElementById('dropZone');
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragover');
      if (e.dataTransfer.files.length > 0) {
        document.getElementById('jsonInput').files = e.dataTransfer.files;
        handleFileSelect({ target: { files: e.dataTransfer.files } });
      }
    });

    function updateUI() {
      renderTabs();
      renderQuestForm();
      renderAnswersForm();
      renderFlow();
    }

    // Initial Render
    updateUI();
  </script>
</body>
</html>
